name: Site

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - name: Check machine-readable outputs
        run: |
          test -s dist/llms.txt
          test ! -e dist/llms-full.txt
          grep -q "^# Genesyx" dist/llms.txt
          grep -q "Disallow: /" dist/robots.txt
          ! grep -q "PLACEHOLDER" dist/llms.txt
          # No stray canonical domain, and the 404 page is never indexable.
          ! grep -rq "genesyx\.com" dist --include=*.html --include=*.xml --include=*.txt
          grep -q 'name="robots" content="noindex' dist/404.html
