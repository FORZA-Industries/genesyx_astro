- id: what-is-shettles
  order: 1
  featured: true
  question: What is the Shettles theory?
  answer: >-
    The Shettles theory, developed by Dr Landrum B. Shettles in the 1960s, proposes that X-bearing and
    Y-bearing sperm behave differently, and that the timing of intercourse around ovulation and the
    vaginal environment may therefore favour one over the other. It suggests intercourse two to four days
    before ovulation for a girl, and as close to ovulation as possible for a boy. Later research has not
    consistently supported the theory, so it should be treated as a method you can follow, not a proven
    outcome.
  related: /shettles-method

- id: why-ph-checks
  order: 2
  featured: true
  question: Why does Genesyx include vaginal pH checks?
  answer: >-
    Vaginal pH is one of the two variables the Shettles theory focuses on, so Genesyx includes at-home test
    strips to replace guesswork with a reading. A healthy vaginal pH is typically between 3.8 and 4.5.
    Genesyx never recommends douching or altering your pH with home remedies, which can cause irritation
    and infection.
  related: /vaginal-ph

- id: guarantee
  order: 3
  featured: true
  question: Can Genesyx guarantee a girl or boy?
  answer: >-
    No. No natural method, including Genesyx, can guarantee the sex of a baby. Genesyx helps you follow
    the Shettles approach consistently, with nutrition, testing and timing in one place, but the
    scientific evidence is mixed and every outcome is welcome.
  related: /evidence

