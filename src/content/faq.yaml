- id: who-is-it-for
  order: 9
  question: Who is Genesyx for?
  answer: >-
    Genesyx is for couples who are trying to conceive naturally and would like to follow the Shettles
    approach in a structured way. It is not a fertility treatment. If you have been trying to conceive for
    more than a year, or have a known health condition, please speak to your GP first.

- id: is-it-legal-uk
  order: 10
  question: Is sex selection legal in the UK?
  answer: >-
    Choosing a baby's sex through IVF or other licensed fertility treatment for non-medical reasons is not
    permitted in the UK. Genesyx is not a medical or fertility treatment; it helps couples follow
    lifestyle and timing guidance while conceiving naturally.

